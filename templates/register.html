<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ResumeAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;

            background: #101015;
            border: 1px solid #292330;
            border-radius: 20px;

            box-sizing: border-box;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #f4f1fa;
        }

        .auth-logo p {
            margin: 0;
            color: #8f8ba0;
            font-size: 13px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #c4bfd2;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;

            box-sizing: border-box;

            background: #121217;
            border: 1px solid #30283b;
            border-radius: 10px;

            color: #ffffff;
            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.10);
        }

        .form-group input::placeholder {
            color: #6f6a7c;
        }

        .register-button {
            width: 100%;
            margin-top: 6px;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #8b5cf6;
            color: white;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
        }

        .auth-footer {
            margin-top: 24px;

            text-align: center;

            color: #8f8ba0;
            font-size: 13px;
        }

        .auth-footer a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px 14px;

            border-radius: 10px;

            background: #15121d;
            border: 1px solid #292330;

            color: #8f8ba0;
            font-size: 11px;
            line-height: 1.5;
        }

        .security-note strong {
            color: #a78bfa;
        }

        @media (max-width: 500px) {

            .auth-card {
                padding: 26px 20px;
            }

        }

    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <h1>🚀 ResumeAI</h1>

            <p>
                Create your account and start improving your career.
            </p>

        </div>


        <form
            action="/register"
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>

        </form>


        <div class="security-note">

            🔐 <strong>Email verification required.</strong>

            After registration, we'll send a 6-digit OTP
            to your email address to verify your account.

        </div>


        <div class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
